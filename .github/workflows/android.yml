name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '*.html'
      - 'js/**'
      - 'css/**'
      - 'icons/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets; APK will be unsigned"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > android/release.jks
          cat > android/keystore.properties <<PROPS
          storeFile=../release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../androidSkyRoom.apk

      - uses: actions/upload-artifact@v4
        with:
          name: androidSkyRoom
          path: androidSkyRoom.apk

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" android/app/build.gradle)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" androidSkyRoom.apk --clobber
          else
            gh release create "$TAG" androidSkyRoom.apk --title "اسکای‌روم پرزنتر $TAG" \
              --notes "اپ اندروید اسکای‌روم با اشتراک صفحه، میکروفون و دوربین. فایل androidSkyRoom.apk را دانلود و نصب کنید."
          fi
